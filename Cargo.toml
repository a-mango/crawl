[package]
name = "crawl"
version = "0.3.0"
description = "A fast web crawler"
repository = "https://github.com/a-mango/crawl"
authors = ["acm"]
license = "MIT"
edition = "2021"
rust-version = "1.89"
readme = "README.md"
keywords = ["crawler", "web", "spider", "cli"]
categories = ["command-line-utilities", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
scraper = "0.24.0"
futures = "0.3.31"
url = "2.5.7"
clap = { version = "4.5.48", features = ["derive", "env"] }
texting_robots = "0.2.2"
psl = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
quick-xml = "0.42"
flate2 = "1"

[dev-dependencies]
mockito = "1.4.0"
tempfile = "3"
