[package]
name = "crawl"
version = "0.1.0"
description = "A fast web crawler"
repository = "https://github.com/a-mango/crawl"
authors = ["acm"]
license = "MIT"
edition = "2021"

[dependencies]
reqwest = { version = "0.12.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
scraper = "0.24.0"
futures = "0.3.31"
url = "2.5.7"
clap = { version = "4.5.48", features = ["derive", "env"] }
atty = "0.2.14"

[dev-dependencies]
mockito = "1.4.0"
